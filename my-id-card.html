<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ID Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2c3e50;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-container {
            display: inline-block;
        }

        .id-card {
            width: 500px;
            height: 300px;
            background: linear-gradient(135deg, #bdc3c7 0%, #95a5a6 100%);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .id-card-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            display: flex;
            padding: 25px;
            position: relative;
        }

        .id-card-left {
            flex: 0 0 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-right: 25px;
            border-right: 2px solid #ecf0f1;
        }

        .id-photo {
            width: 130px;
            height: 150px;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .id-title {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 8px 15px;
            background: #2c3e50;
            color: white;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .id-card-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: 20px;
        }

        .id-header {
            text-align: left;
        }

        .org-logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1;
            letter-spacing: 2px;
        }

        .logo-highlight {
            color: #e74c3c;
        }

        .org-name {
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .id-details {
            font-size: 12px;
            color: #555;
            line-height: 2;
        }

        .id-details div {
            margin-bottom: 5px;
        }

        .id-details strong {
            color: #2c3e50;
            font-weight: 600;
            display: inline-block;
            min-width: 80px;
        }

        .barcode {
            margin-top: 15px;
            height: 45px;
            background: linear-gradient(90deg, 
                #000 0%, #000 8%, #fff 8%, #fff 12%,
                #000 12%, #000 16%, #fff 16%, #fff 20%,
                #000 20%, #000 28%, #fff 28%, #fff 32%,
                #000 32%, #000 36%, #fff 36%, #fff 40%,
                #000 40%, #000 48%, #fff 48%, #fff 52%,
                #000 52%, #000 56%, #fff 56%, #fff 60%,
                #000 60%, #000 64%, #fff 64%, #fff 68%,
                #000 68%, #000 76%, #fff 76%, #fff 80%,
                #000 80%, #000 84%, #fff 84%, #fff 88%,
                #000 88%, #000 96%, #fff 96%, #fff 100%
            );
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .instructions {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="id-card">
            <div class="id-card-inner">
                <div class="id-card-left">
                    <img src="assets/01a0ae95-7aa0-7d9c-ba8d-a393b6284883.jpg" alt="ID Photo" class="id-photo">
                    <div class="id-title">MEMBER</div>
                </div>
                <div class="id-card-right">
                    <div class="id-header">
                        <div class="org-logo">
                            <span>P</span><span class="logo-highlight">M</span><span>S</span>
                        </div>
                        <div class="org-name">Professional Members Society</div>
                    </div>
                    <div class="id-details">
                        <div><strong>Member ID:</strong> 2024-001-PMS</div>
                        <div><strong>Issue Date:</strong> 09/2026</div>
                        <div><strong>Valid Until:</strong> 09/2027</div>
                    </div>
                    <div class="barcode"></div>
                </div>
            </div>
        </div>
        <div class="instructions">
            📸 Right-click on the card and select "Save image as..." to download
        </div>
    </div>
</body>
</html>
